# Azure CLI ZIP deployment: https://learn.microsoft.com/azure/app-service/deploy-zip

name: Build and deploy Node.js app to Azure Web App - infoid26

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js version
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'

      - name: npm install, build, and test
        run: |
          npm install
          npm run build --if-present
          npm run build:project
          npm run check
          npm run check:learning
          npm run check:workshop
          npm run check:azure
          npm run check:accounts
          npm run check:evaluator
          npm run check:sandboxes
          npm run check:coverage
          npm run check:curriculum
          node scripts/check_project_database.mjs
          npm run check:project

      - name: Bundle verified Azure Sandbox CLI
        run: node scripts/install_aca.mjs

      - name: Package Linux application preserving executable permissions
        run: tar -czf node-app.tar.gz index.html package.json pnpm-lock.yaml site scripts project-reference evaluator node_modules tools

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v6
        with:
          name: node-app
          path: node-app.tar.gz
          compression-level: 0

  deploy:
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v7
        with:
          name: node-app

      - name: Extract Linux application
        run: |
          tar -xzf node-app.tar.gz
          rm node-app.tar.gz

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_6A34551C251847D691A5825D12FEA5CC }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_95A1994BA35C4C3F835B32AEEBA6E7A3 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_AFBC12824B654B14B0AE85C81F57CE50 }}

      - name: Package deployment ZIP
        run: zip -q -r "$RUNNER_TEMP/tehnici-web.zip" index.html package.json pnpm-lock.yaml site scripts project-reference evaluator node_modules tools

      - name: Deploy to Azure Web App with Azure CLI
        id: deploy-to-webapp
        run: |
          az webapp config set \
            --resource-group infoid_group \
            --name infoid26 \
            --startup-file "npm start" \
            --always-on true \
            --output none
          az webapp deploy \
            --resource-group infoid_group \
            --name infoid26 \
            --src-path "$RUNNER_TEMP/tehnici-web.zip" \
            --type zip \
            --clean true \
            --restart true \
            --output none
